<title>My comics</title>
<style>
/* Every text pair clears 7:1 in both themes. */
:root { --bg: #f4f1ea; --surface: #fffdf8; --text: #1d1b18; --note: #45413a; --border: #ddd7ca; --well: #e8e3d8;
  --accent: #174a8c; --ok: #185c2d; --on-ok: #ffffff; --field: #ffffff; --field-edge: #7d7666; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #111316; --surface: #1a1d22; --text: #ece8e1; --note: #c4beb3; --border: #33373f;
  --well: #25282e; --accent: #9cc3ff; --ok: #185c2d; --on-ok: #ffffff; --field: #0e1013; --field-edge: #7a818e; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--border); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 11em); gap: 8px; }
/* Safari ignores padding on its own menu style, so the menu draws itself: the search box's size, a chevron in the text color. */
select { font: inherit; font-size: 17px; line-height: 1.45; padding: 10px 34px 10px 12px; border-radius: 10px; border: 1px solid var(--field-edge); color: var(--text); min-width: 0; width: 100%;
  -webkit-appearance: none; appearance: none; background-color: var(--field);
  background-image: linear-gradient(45deg, transparent 50%, var(--text) 50%), linear-gradient(135deg, var(--text) 50%, transparent 50%);
  background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px; background-repeat: no-repeat; }
@media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
input { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--field-edge); background: var(--field); color: var(--text); }
input::placeholder { color: var(--note); opacity: 1; }
.count { font-size: 14px; color: var(--note); margin-top: 6px; }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 1200px; margin: 0 auto; }
.b { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.b a { display: block; }
.b img, .none { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background: var(--well); border-radius: 6px; display: block; }
.none { display: flex; align-items: center; justify-content: center; font-size: 14px; }
.t { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.m { font-size: 14px; color: var(--note); }
.g { align-self: flex-start; font-size: 14px; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: var(--ok); color: var(--on-ok); font-variant-numeric: tabular-nums; }
.g.no { background: var(--well); color: var(--text); font-weight: 600; }
.v { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 2px; }
.v span { background: var(--well); border-radius: 6px; padding: 2px 6px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.v small { display: block; font-size: 12px; font-weight: 600; color: var(--note); text-transform: uppercase; letter-spacing: .04em; }
.empty { grid-column: 1 / -1; text-align: center; padding: 40px 0; }
.b { content-visibility: auto; contain-intrinsic-size: auto 340px; }
/* A missing issue: the catalog's scan, never mistaken for my copy. */
.b.miss { border: 2px dashed var(--note); background: var(--bg); }
.g.gone { background: var(--well); color: var(--text); border: 1px solid var(--note); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 8px; border: 1px solid var(--field-edge); border-radius: 10px; overflow: hidden; }
.seg button { font: inherit; font-size: 16px; font-weight: 600; padding: 8px 0; border: 0; background: var(--field); color: var(--text); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--field-edge); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
footer { text-align: center; font-size: 14px; color: var(--note); padding: 0 16px 24px; }
/* The cover viewer: on the page, so a Home Screen icon (no Back button) never leaves it. */
.view { position: fixed; inset: 0; z-index: 10; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.view[hidden] { display: none; }
.view img { max-width: 100%; max-height: calc(100% - 56px); object-fit: contain; touch-action: pinch-zoom; }
.view .cap { color: #fff; font-size: 15px; padding: 8px 16px; text-align: center; }
.view .x { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 48px; height: 48px;
  border-radius: 50%; border: 2px solid #fff; background: rgba(0, 0, 0, .7); color: #fff; font: 700 24px/1 -apple-system, sans-serif; cursor: pointer; }
.view .x:focus-visible { outline: 3px solid #9cc3ff; outline-offset: 2px; }
</style>
</head>

const usd = v => v == null ? '—' : '$' + (v >= 1000 ? Math.round(v).toLocaleString() : (Number.isInteger(v) ? v : v.toFixed(2)));

// Words match from their start ("scro" finds Scrooge); a number matches whole: an issue number, a year
// or a Book ID ("16" is #16, not #160 or 1956). "#16" is only the issue number.
BOOKS.forEach((b, i) => {
  b.i = i; b.own = !b.m;
  b.words = norm(`${b.t.replace(/#\S+/g, '')} ${b.a.replace(/#\S+/g, '')} ${b.n} ${b.p}`).split(' ').filter(Boolean);
  b.nums = new Set([...b.no.map(n => norm(n).trim()), b.y, ...(b.own ? [String(b.id)] : [])]);
  b.issue = new Set(b.no.map(n => norm(n).trim()));
  b.series = new Set(b.s.map(x => norm(x).trim()));
});
const small = b => b.own ? `t/${b.id}.jpg` : `m/${b.m}.jpg`, large = b => b.own ? `f/${b.id}.jpg` : `m/${b.m}.jpg`;
const fits = (b, w) => w.startsWith('#') ? b.issue.has(w.slice(1)) : /^\d+$/.test(w) ? b.nums.has(w) : b.words.some(x => x.startsWith(w));

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function card(b) {
  const d = document.createElement('article'); d.className = b.own ? 'b' : 'b miss';
  const img = b.img ? `<a href="${large(b)}" data-i="${b.i}"><img src="${small(b)}" loading="lazy" decoding="async" alt="${esc(b.t)}${b.own ? `, Book ID #${b.id}` : ', catalog scan'}"></a>` : '<div class="none">No photo</div>';
  const g = !b.own ? '<span class="g gone">Missing</span>' : b.g ? `<span class="g">${b.g.v} ${b.g.l}${b.g.o ? '' : ' · AI'}</span>` : '<span class="g no">Not graded</span>';
  const v = b.$ ? `<div class="v"><span><small>Low</small>${usd(b.$[0])}</span><span><small>Mid</small>${usd(b.$[1])}</span><span><small>High</small>${usd(b.$[2])}</span></div>` : '<div class="m">No guide value</div>';
  d.innerHTML = `${img}<div class="t"></div><div class="m"></div>${g}${v}`;
  d.querySelector('.t').textContent = b.t;
  d.querySelector('.m').textContent = [b.y, b.p, b.c, b.own ? `Book ID #${b.id}` : 'catalog scan', b.a && `counted as ${b.a}`].filter(Boolean).join(' · ');
  return d;
}
const cards = new Map();
const cardOf = b => cards.get(b) || (cards.set(b, card(b)), cards.get(b));
let shown = [], at = -1, mode = 'have';      // the list on screen, which of it the viewer shows, and Have / Missing / All
// Tapping a cover opens it here. It closes with the ✕, a tap on it, Esc, or Back (which closes it rather than
// leaving the page: opening pushes one history entry, closing pops it; moving between covers adds none).
const view = document.getElementById('view'), vimg = document.getElementById('view-img'), vcap = document.getElementById('view-cap');
function draw() {
  const b = shown[at];
  vimg.src = large(b); vimg.alt = b.own ? `${b.t}, Book ID #${b.id}` : `${b.t}, catalog scan`;
  vcap.textContent = (b.own ? `${b.t} · Book ID #${b.id}` : `${b.t} · missing · catalog scan`) + (shown.length > 1 ? ` · ${at + 1} of ${shown.length}` : '');
  for (const k of [at - 1, at + 1]) if (shown[k]) new Image().src = large(shown[k]);   // the neighbors, ready for a swipe

function openView(b) {

// Swipe left for the next cover, right for the previous. Not while zoomed in (a drag then pans), and a swipe

  e.preventDefault();

const inMode = b => mode === 'all' || (mode === 'have') === b.own;
// The Series menu: each series with what it holds in the current view (Have, Missing or All), by name; a book

const sel = document.getElementById('s');
const MENU_MIN = 5;                 // series with fewer in the view are left out of the menu (the search still finds them)
function menu() {
  const keep = sel.value, names = new Map();
  for (const b of BOOKS) if (inMode(b)) for (const x of b.s) {
    const k = norm(x).trim(), e = names.get(k) || { name: x, n: 0, disney: 0, pubs: new Map() };
    e.n++; if (b.d) e.disney++; names.set(k, e);
    const pk = norm(b.p).trim(), pe = e.pubs.get(pk) || { name: b.p || 'Publisher not known', n: 0, from: '9999', to: '0000' };
    pe.n++; if (b.y) { if (b.y < pe.from) pe.from = b.y; if (b.y > pe.to) pe.to = b.y; } e.pubs.set(pk, pe);
  }
  sel.replaceChildren(new Option(mode === 'missing' ? 'All series' : 'All series', ''));
  for (const [k, e] of [...names].sort((a, b) => a[1].name.localeCompare(b[1].name))) {
    if (e.n < MENU_MIN && !keep.startsWith(k)) continue;
    if (e.disney && e.disney < e.n) {
      sel.append(new Option(`${e.name}, Disney (${e.disney})`, k + '|disney'));
      sel.append(new Option(`${e.name}, all (${e.n})`, k));
    } else sel.append(new Option(`${e.name} (${e.n})`, k));
    // A series several publishers carried (Uncle Scrooge: Dell, Gold Key, Whitman, Gladstone, ...): one entry each, by date.
    if (e.pubs.size > 1)
      for (const [pk, pe] of [...e.pubs].sort((a, b) => a[1].from.localeCompare(b[1].from)))
        sel.append(new Option(`${e.name} · ${pe.name.replace(/,? Inc\.?$/, '')}${pe.from <= pe.to ? `, ${pe.from}${pe.to !== pe.from ? '–' + pe.to : ''}` : ''} (${pe.n})`, `${k}|pub:${pk}`));
  }
  if (keep && ![...sel.options].some(o => o.value === keep)) sel.append(new Option(`${keep.replace('|disney', ', Disney').replace('|pub:', ' · ')} (0)`, keep));

}
const modeButtons = [...document.querySelectorAll('.seg button')];
function setMode(m) {
  mode = m;
  for (const x of modeButtons) x.setAttribute('aria-pressed', x.dataset.mode === m ? 'true' : 'false');
  menu();
}
function show() {
  // "In quotes": the series named exactly that (or counted as it), so "uncle scrooge" leaves out Uncle Scrooge
  // Adventures. The iPhone keyboard types curly quotes; both kinds work.
  // Still typing (no closing quote yet): the series that start with what is typed so far.
  const phrases = [], rest = q.value.replace(/["“”]([^"“”]*)(["“”]?)/g, (_, x, closed) => {
    if (norm(x).trim()) phrases.push([norm(x).trim(), !!closed]); return ' '; });
  const words = norm(rest).split(' ').filter(Boolean);
  const inSeries = (b, [x, closed]) => closed ? b.series.has(x) : [...b.series].some(s => s.startsWith(x));
  const [pick, only = ''] = sel.value.split('|');
  const fitsOnly = b => only === 'disney' ? b.d : only.startsWith('pub:') ? norm(b.p).trim() === only.slice(4) : true;
  const hits = BOOKS.filter(b => inMode(b) && (!pick || (b.series.has(pick) && fitsOnly(b)))
                                && phrases.every(x => inSeries(b, x)) && words.every(w => fits(b, w)));
  shown = hits;
  list.replaceChildren(...hits.map(cardOf));
  if (!hits.length) list.innerHTML = `<p class="empty">${mode === 'missing' ? 'No missing issues match.' : 'No comics match.'}</p>`;
  const have = hits.filter(b => b.own).length;
  count.textContent = mode === 'have' ? `${have} comic${have === 1 ? '' : 's'} you have`
    : mode === 'missing' ? `${hits.length} missing issue${hits.length === 1 ? '' : 's'}, shown by the catalog's scan`
    : `${hits.length} · ${have} you have, ${hits.length - have} missing`;
  const h = new URLSearchParams();
  if (mode !== 'have') h.set('m', mode);
  if (sel.value) h.set('s', sel.value);
  if (q.value.trim()) h.set('q', q.value.trim());
  try { history.replaceState(history.state, '', h.toString() ? '#' + h : location.pathname); } catch (e) {}
}
const h = new URLSearchParams(location.hash.slice(1));
if (h.has('s') || h.has('q') || h.has('m')) {
  setMode(['missing', 'all'].includes(h.get('m')) ? h.get('m') : 'have');
  // A link to a series the menu does not list opens it as that series typed in quotes.
  const s = h.get('s') || '';
  if (s && ![...sel.options].some(o => o.value === s)) q.value = `"${s.split('|')[0]}" ${h.get('q') || ''}`.trim();
  else { sel.value = s; q.value = h.get('q') || ''; }
} else { setMode('have'); q.value = decodeURIComponent(location.hash.slice(1)); }     // older links: the hash was the search
q.addEventListener('input', show);
sel.addEventListener('change', show);
for (const x of modeButtons) x.addEventListener('click', () => { setMode(x.dataset.mode); show(); });
show();
