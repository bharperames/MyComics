<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Scan a comic</title>
<style>
/* Every text pair clears 7:1 in both themes. The camera view is dark in both. */
:root { --bg: #f4f1ea; --surface: #fffdf8; --text: #1d1b18; --note: #45413a; --border: #ddd7ca; --well: #e8e3d8;
  --accent: #174a8c; --ok: #185c2d; --on-ok: #ffffff; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #111316; --surface: #1a1d22; --text: #ece8e1; --note: #c4beb3; --border: #33373f;
  --well: #25282e; --accent: #9cc3ff; --ok: #185c2d; --on-ok: #ffffff; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
.cam { position: fixed; inset: 0; }
video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
/* The guide box: what is scanned. Everything outside it is dimmed. */
.box { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); width: min(74vw, 58vh * 0.68); aspect-ratio: 0.68;
  border: 3px solid #fff; border-radius: 10px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .55); pointer-events: none; }
/* The hint spans the width over the List link: it must not take its taps. */
.hint { position: absolute; left: 0; right: 0; top: calc(10px + env(safe-area-inset-top)); text-align: center; font-size: 16px; font-weight: 600; padding: 0 70px; pointer-events: none; }
.top { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 12px; z-index: 1; }
.top a { color: #fff; font-weight: 700; font-size: 16px; display: inline-block; padding: 8px 12px; border-radius: 10px; background: rgba(0, 0, 0, .6); text-decoration: none; }
.bar { position: absolute; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; justify-content: center; align-items: center; gap: 18px; }
.shoot { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff; background: rgba(255, 255, 255, .25); color: #fff; font: 700 15px/1 -apple-system, sans-serif; }
.shoot:disabled { opacity: .5; }
.pick { color: #fff; font-weight: 600; font-size: 15px; padding: 10px 12px; border-radius: 10px; background: rgba(0, 0, 0, .6); border: 1px solid #fff; }
.pick input { display: none; }
.status { position: absolute; left: 16px; right: 16px; bottom: calc(110px + env(safe-area-inset-bottom)); text-align: center; font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px #000; }
/* The result: a sheet over the camera. */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 82vh; overflow-y: auto; background: var(--bg); color: var(--text);
  border-radius: 16px 16px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 24px rgba(0, 0, 0, .5); }
.sheet[hidden] { display: none; }
.best { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; }
.best img, .best .none, .alt img, .alt .none { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background: var(--well); border-radius: 6px; display: block; }
.none { display: flex; align-items: center; justify-content: center; font-size: 13px; text-align: center; padding: 4px; color: var(--text); }
.kicker { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--note); }
.kicker.sure { color: var(--text); }
.kicker.unknown { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--text); }
.title { font-size: 22px; font-weight: 800; line-height: 1.2; margin: 2px 0 4px; overflow-wrap: anywhere; }
.meta { font-size: 15px; color: var(--note); }
.own { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 16px; }
.own.have { background: var(--ok); color: var(--on-ok); }
.own.miss { background: var(--well); color: var(--text); border: 1px dashed var(--note); }
.val { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.val span { background: var(--well); border-radius: 6px; padding: 2px 6px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.val small { display: block; font-size: 12px; font-weight: 600; color: var(--note); text-transform: uppercase; letter-spacing: .04em; }
.val.none { font-size: 13px; color: var(--note); margin-top: 6px; }
.best .buy { display: inline-block; margin-top: 8px; font-size: 15px; font-weight: 700; color: var(--accent); text-decoration: underline; }
.alts-h { font-size: 15px; font-weight: 700; margin: 16px 0 8px; }
.alts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.alt { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px; font: inherit; color: var(--text); text-align: left; cursor: pointer; }
.alt b { display: block; font-size: 13px; line-height: 1.25; margin-top: 4px; overflow-wrap: anywhere; }
.alt span { display: block; font-size: 12px; color: var(--note); }
.again { display: block; width: 100%; margin-top: 16px; padding: 12px; border-radius: 10px; border: 0; background: var(--accent); color: var(--bg); font: 700 17px -apple-system, sans-serif; }
.err { color: var(--text); }
/* A picture on the result card opens the cover viewer (tap it); the rest of a candidate's card picks it. */
.zoom { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 6px; }
.alt { display: flex; flex-direction: column; }
.alt .pickit { font: inherit; color: var(--text); text-align: left; background: none; border: 0; padding: 0; cursor: pointer; flex: 1; }
/* The cover viewer: on the page, so a Home Screen icon (no Back button) never leaves it. */
.view { position: fixed; inset: 0; z-index: 10; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.view[hidden] { display: none; }
.view { touch-action: none; }          /* the viewer zooms and pans the cover itself; the page never zooms */
.view img { max-width: 100%; max-height: calc(100% - 56px); object-fit: contain; transform-origin: 50% 50%; will-change: transform; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.view .cap { color: #fff; font-size: 15px; padding: 8px 16px; text-align: center; }
.view .x { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 48px; height: 48px;
  border-radius: 50%; border: 2px solid #fff; background: rgba(0, 0, 0, .7); color: #fff; font: 700 24px/1 -apple-system, sans-serif; cursor: pointer; }
.view .x:focus-visible { outline: 3px solid #9cc3ff; outline-offset: 2px; }
.view .buy { color: #9cc3ff; font-size: 15px; font-weight: 700; padding: 4px 16px 10px; text-decoration: underline; }
.view .buy[hidden] { display: none; }
.view .buy:focus-visible { outline: 3px solid #9cc3ff; outline-offset: 2px; }
.view .use { margin-top: 4px; padding: 10px 22px; border-radius: 10px; border: 2px solid #fff; background: #174a8c; color: #fff; font: 700 17px -apple-system, sans-serif; cursor: pointer; }
.view .use[hidden] { display: none; }
</style>
</head>
<body>
<div class="cam"><video id="video" playsinline muted autoplay></video><div class="box" id="box"></div></div>
<div class="top"><a href="./">‹ List</a></div>
<div class="hint">Fill the box with the cover, then tap Scan</div>
<div class="status" id="status" role="status">Getting ready…</div>
<div class="bar">
  <label class="pick">Choose a photo<input type="file" id="file" accept="image/*"></label>
  <button class="shoot" id="shoot" type="button" disabled>Scan</button>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="Scan result"></div>
<div class="view" id="view" hidden role="dialog" aria-modal="true" aria-label="Cover"><button class="x" id="view-x" type="button" aria-label="Close">✕</button><img id="view-img" alt=""><div class="cap" id="view-cap"></div><a class="buy" id="view-buy" target="_blank" rel="noopener">Find on eBay ↗</a></div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
// Scan a comic: the phone names the issue from the camera, on its own (no server). The two models (DINOv2-small
// and SigLIP-base's vision tower, the builds studies/phone_onnx.py measured) come from Hugging Face once and are kept
// in this phone's cache; scan/ holds every indexed catalog cover, embedded here with the same builds.
const $ = id => document.getElementById(id), status = t => { $('status').textContent = t; };
ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
let DATA, VEC, sessions = {}, rows;
async function cached(url, label) {
  // The model file from this phone's cache, else downloaded once (with progress) and kept.
  let cache = null;
  try { cache = await caches.open('mycomics-models-v1'); const hit = await cache.match(url); if (hit) return await hit.arrayBuffer(); } catch (e) {}
  const r = await fetch(url); if (!r.ok) throw new Error(`${label}: HTTP ${r.status}`);
  const total = Number(r.headers.get('content-length')) || 0, reader = r.body.getReader(), parts = []; let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length;
    if (total) status(`Downloading ${label} (first time only): ${Math.round(100 * got / total)}%`); }
  const buf = await new Blob(parts).arrayBuffer();
  try { if (cache) await cache.put(url, new Response(buf.slice(0))); } catch (e) {}
  return buf;
}
async function ready() {
  const v = new URLSearchParams(location.search).get('v') || '';
  DATA = await (await fetch('scan/data.json?v=' + v)).json();
  VEC = new Int8Array(await (await fetch('scan/vectors.bin?v=' + v)).arrayBuffer());
  rows = DATA.covers.length;
  for (const [model, label] of [['dino', 'the first model'], ['siglip', 'the second model']])
    sessions[model] = await ort.InferenceSession.create(await cached(DATA.builds[model], label), { executionProviders: ['wasm'] });
}
// The models' input: the scanned area letterboxed onto a gray square, scaled to 0-1 and normalized, as measured.
function input(src, sx, sy, sw, sh, model) {
  const n = DATA.size, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'); g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, n, n);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  const s = n / Math.max(sw, sh), w = Math.round(sw * s), h = Math.round(sh * s);
  g.drawImage(src, sx, sy, sw, sh, Math.round((n - w) / 2), Math.round((n - h) / 2), w, h);
  const px = g.getImageData(0, 0, n, n).data, [mean, std] = DATA.mean_std[model], out = new Float32Array(3 * n * n);
  for (let i = 0; i < n * n; i++) for (let k = 0; k < 3; k++) out[k * n * n + i] = (px[i * 4 + k] / 255 - mean[k]) / std[k];
  return new ort.Tensor('float32', out, [1, 3, n, n]);
}
async function embed(src, box, model) {
  const r = await sessions[model].run({ pixel_values: input(src, ...box, model) });
  const t = r.pooler_output || r.last_hidden_state, d = t.dims[t.dims.length - 1];
  const v = Float32Array.from(t.data.subarray(0, d));            // DINOv2: the first (CLS) token; SigLIP: the pooled vector
  let s = 0; for (const x of v) s += x * x; s = Math.sqrt(s) || 1;
  return v.map(x => x / s);
}
// Each issue's similarity: the mean of the two models' cosines with its best cover. Ranked by that, and judged by it:
// studies/phone_confidence.py (2026-11-22, the owner's photos): a match at 0.86 or more and 0.03 ahead of the next
// issue is right 99% of the time (58% of right answers get there); under 0.80 the comic is most likely not one the
// scan knows; in between, the first guess is right 74% of the time.
const SURE = 0.86, LEAD = 0.03, UNKNOWN = 0.80;
function rank(qs) {
  const [d0, d1] = DATA.dims, stride = d0 + d1, best = [new Map(), new Map()];
  [[qs.dino, 0, d0], [qs.siglip, d0, d1]].forEach(([q, off, d], m) => {
    for (let r = 0; r < rows; r++) {
      let s = 0; const o = r * stride + off;
      for (let k = 0; k < d; k++) s += q[k] * VEC[o + k];
      s /= 127;                                               // the vectors were stored x127 as int8
      const iss = DATA.covers[r]; if (!(best[m].get(iss) >= s)) best[m].set(iss, s);
    }
  });
  const mean = [...best[0]].map(([iss, s]) => [iss, (s + (best[1].get(iss) ?? s)) / 2]).sort((a, b) => b[1] - a[1]);
  const top = mean[0][1], lead = top - (mean[1] ? mean[1][1] : 0);
  return { order: mean.map(([iss]) => iss), sims: new Map(mean), tier: top >= SURE && lead >= LEAD ? 'sure' : top < UNKNOWN ? 'unknown' : 'likely' };
}
const pic = (it, k) => it.img ? `<button class="zoom" type="button" data-z="${k}" aria-label="Enlarge ${esc(it.t)}"><img src="${it.img}" alt=""></button>`
  : `<div class="none">No picture here</div>`;
// The viewer shows the result card's issues in its order (the one on top first), my own copy's photo full size.
let shown = [], at = -1, pickFrom = null;
const viewOf = k => {
  const it = DATA.issues[k];
  return { src: it.img.replace(/^t\//, 'f/'), alt: it.t, buy: ebay(it.t),
           cap: [it.t, it.y, it.own ? `you have ${it.own}${it.g ? ', best ' + it.g : ''}` : it.miss ? 'missing' : "you don't have it"].filter(Boolean).join(' · ') };
};
const useBtn = document.createElement('button');
useBtn.className = 'use'; useBtn.type = 'button'; useBtn.textContent = 'This is it';
document.getElementById('view').append(useBtn);
const onDraw = () => { useBtn.hidden = !pickFrom || shown[at] === pickFrom.current; };
useBtn.addEventListener('click', e => { e.stopPropagation(); const k = shown[at]; closeView(); pickFrom.pick(k); });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function ownLine(it) {
  if (it.own) return `<span class="own have">You have ${it.own}${it.g ? ` · best ${esc(it.g)}${it.ai ? ' (AI)' : ''}` : ' · not graded'}</span>`;
  return `<span class="own miss">${it.miss ? 'Missing from your collection' : "You don't have it"}</span>`;
}
// The issue's low / mid / high grade value (Key Collector's, else the median of copies sold in that grade range).
const money = v => v == null ? '—' : v < 1 ? 'under $1' : '$' + Math.round(v).toLocaleString();      // whole dollars
function valueLine(it) {
  if (!it.v) return '<div class="val none">No value yet</div>';
  return `<div class="val"><span><small>Low</small>${money(it.v[0])}</span><span><small>Mid</small>${money(it.v[1])}</span><span><small>High</small>${money(it.v[2])}</span></div>`;
}
function result({ order, tier }) {
  const KICK = { sure: 'Match', likely: 'Likely: check the others below', unknown: 'Not recognized: probably not in the catalog. Closest:' };
  const show = k => {
    const it = DATA.issues[order[k]];
    const alts = order.filter((_, j) => j !== k).slice(0, 4).map(i => [i, DATA.issues[i]]);
    $('sheet').innerHTML = `<div class="best">${pic(it, order[k])}<div><div class="kicker ${k ? '' : tier}">${k ? 'Picked' : KICK[tier]}</div>
      <div class="title">${esc(it.t)}</div><div class="meta">${esc([it.y, it.p].filter(Boolean).join(' · '))}</div>${ownLine(it)}${valueLine(it)}<a class="buy" href="${esc(ebay(it.t))}" target="_blank" rel="noopener">Find on eBay ↗</a></div></div>
      <div class="alts-h">Not it? Other likely issues</div><div class="alts">${alts.map(([i, a]) =>
        `<div class="alt">${pic(a, i)}<button class="pickit" type="button" data-k="${order.indexOf(i)}"><b>${esc(a.t)}</b><span>${a.own ? 'have ' + a.own : a.miss ? 'missing' : "don't have"}</span></button></div>`).join('')}</div>
      <button class="again" id="again" type="button">Scan another</button>`;
    $('sheet').hidden = false;
    $('sheet').querySelectorAll('.pickit').forEach(b => b.addEventListener('click', () => show(Number(b.dataset.k))));
    const card = [order[k], ...alts.map(([i]) => i)].filter(i => DATA.issues[i].img);
    pickFrom = { current: order[k], pick: i => show(order.indexOf(i)) };
    $('sheet').querySelectorAll('.zoom').forEach(b => b.addEventListener('click', () => { shown = card; openView(Number(b.dataset.z)); }));
    $('again').addEventListener('click', () => { $('sheet').hidden = true; status(''); });
  };
  show(0);
}
async function scanFrom(src, box) {
  $('shoot').disabled = true; status('Looking…');
  try {
    const t0 = performance.now();
    const qs = { dino: await embed(src, box, 'dino'), siglip: await embed(src, box, 'siglip') };
    const r = rank(qs);
    status(`${Math.round(performance.now() - t0)} ms`);
    window.lastScan = { order: r.order.slice(0, 5).map(i => DATA.issues[i].t), tier: r.tier, top: r.sims.get(r.order[0]) };   // for testing
    result(r);
  } catch (e) { status('Could not scan: ' + e.message); }
  $('shoot').disabled = false;
}
// The guide box in the video's own pixels (the video fills the screen, cropped to cover it).
function boxInVideo() {
  const v = $('video'), b = $('box').getBoundingClientRect(), e = v.getBoundingClientRect();
  const s = Math.max(e.width / v.videoWidth, e.height / v.videoHeight), ox = (e.width - v.videoWidth * s) / 2, oy = (e.height - v.videoHeight * s) / 2;
  return [(b.left - e.left - ox) / s, (b.top - e.top - oy) / s, b.width / s, b.height / s];
}
// The cover viewer (shared by the list and the scan). A page defines shown (the covers), viewOf(cover) ->
// {src, alt, cap} and onDraw(), and opens it with openView(cover). Tapping a cover opens it here. It closes with the ✕, a tap on it, Esc, or Back (which closes it rather than
// leaving the page: opening pushes one history entry, closing pops it; moving between covers adds none).
const view = document.getElementById('view'), vimg = document.getElementById('view-img'), vcap = document.getElementById('view-cap'), vbuy = document.getElementById('view-buy');
// eBay's listing search (auctions and Buy It Now, in Comic Books & Memorabilia) for a title like "Classics Illustrated #1 [HRN 36]":
// the series and the number, without the printing mark (web/catalog.py ebay_query, the same words).
function ebay(t) {
  if (!t || t.startsWith('Not identified')) return '';
  const q = t.replace(/\s*\[[^\]]*\]$/, '').replace(/\s#(?=[^#]*$)/, ' ');
  return 'https://www.ebay.com/sch/i.html?_sacat=63&_nkw=' + encodeURIComponent(q);
}
function draw() {
  zoomReset();
  const v = viewOf(shown[at]);
  vimg.src = v.src; vimg.alt = v.alt;
  vcap.textContent = v.cap + (shown.length > 1 ? ` · ${at + 1} of ${shown.length}` : '');
  vbuy.hidden = !v.buy; if (v.buy) vbuy.href = v.buy;
  for (const k of [at - 1, at + 1]) if (shown[k]) new Image().src = viewOf(shown[k]).src;   // the neighbors, ready for a swipe
  onDraw();
}
function openView(b) {
  at = shown.indexOf(b); if (at < 0) { shown = [b]; at = 0; }
  draw();
  view.hidden = false; document.body.style.overflow = 'hidden';
  try { history.pushState({ view: 1 }, ''); } catch (e) {}
  document.getElementById('view-x').focus();
}
// Next (+1) or previous (-1) cover of the list on screen; stops at either end.
function step(d) {
  if (view.hidden || !shown[at + d]) return;
  at += d; draw();
  vimg.animate([{ opacity: 0, transform: `translateX(${d * 40}px)` }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'ease-out' });
}
// The viewer's own zoom: pinch to zoom (about the fingers), drag to pan while zoomed, double-tap to zoom in on a
// spot or back out. At normal size a swipe sideways goes to the next or previous cover, a swipe down closes and a tap
// closes; zoomed, they pan.
let zs = 1, zx = 0, zy = 0;                       // scale and offset of the cover
const pts = new Map();                             // pointers down: id -> {x, y}
let g0 = null, moved = false, lastTap = 0, swiped = false;
function apply() {
  const r = vimg.getBoundingClientRect(), w = r.width / zs, h = r.height / zs;     // the cover's size unzoomed
  const mx = Math.max(0, (w * zs - innerWidth) / 2 + 20), my = Math.max(0, (h * zs - innerHeight) / 2 + 20);
  zx = Math.max(-mx, Math.min(mx, zx)); zy = Math.max(-my, Math.min(my, zy));          // never dragged off screen
  vimg.style.transform = zs > 1.001 ? `translate(${zx}px, ${zy}px) scale(${zs})` : '';
}
function zoomReset() { zs = 1; zx = zy = 0; vimg.style.transform = ''; }
function zoomAt(s, cx, cy, from) {                 // scale to s keeping the screen point (cx, cy) where it was
  const r = vimg.getBoundingClientRect(), ox = r.left + r.width / 2 - zx, oy = r.top + r.height / 2 - zy;   // the cover's center, unshifted
  const f = s / from.s;
  zx = (cx - ox) - (cx - ox - from.x) * f; zy = (cy - oy) - (cy - oy - from.y) * f; zs = s;
  if (zs <= 1.001) { zs = 1; zx = zy = 0; }
  apply();
}
const mid = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) }; };
view.addEventListener('pointerdown', e => {
  if (e.target.closest('button, a')) return;      // the viewer's own buttons and link (close, eBay, a page's extras) are not gestures
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { view.setPointerCapture(e.pointerId); } catch (err) { /* keep going without capture */ }
  const m = pts.size === 2 ? mid() : null;
  g0 = { s: zs, x: zx, y: zy, px: e.clientX, py: e.clientY, m, t: Date.now() };
  if (pts.size === 1) moved = false;
});
view.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId) || !g0) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2 && g0.m) {
    const m = mid();
    zoomAt(Math.max(1, Math.min(6, g0.s * m.d / g0.m.d)), m.x, m.y, g0);
    zx += m.x - g0.m.x; zy += m.y - g0.m.y; apply();
    moved = true;
  } else if (pts.size === 1) {
    const dx = e.clientX - g0.px, dy = e.clientY - g0.py;
    if (Math.hypot(dx, dy) > 8) moved = true;
    if (zs > 1) { zx = g0.x + dx; zy = g0.y + dy; apply(); }
    else if (dy > 0 && dy > Math.abs(dx)) {        // pulled down at normal size: the cover follows, the black thins

});
function up(e) {

  if (pts.size === 1) {                            // a pinch became a one-finger pan
    const [p] = pts.values(); g0 = { s: zs, x: zx, y: zy, px: p.x, py: p.y, m: null, t: Date.now() }; return;
  }
  if (pts.size || !start || wasPinch) return;
  const dx = e.clientX - start.px, dy = e.clientY - start.py;
  if (zs === 1 && vimg.style.transform) {          // a pull down: far or fast enough closes, else the cover goes back
    if (dy > 100 || (dy > 40 && dy / (Date.now() - start.t) > .5)) { closeView(); return; }
    pullBack(); if (moved) return;
  }
  if (zs === 1 && Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) {          // a swipe
    swiped = true; step(dx < 0 ? 1 : -1); setTimeout(() => { swiped = false; }, 400); return;
  }
  if (moved) return;

  if (now - lastTap < 300) {                       // double tap: zoom in on that spot, or back out
    lastTap = 0; clearTimeout(tapTimer);
    if (zs > 1) zoomReset(); else zoomAt(2.5, e.clientX, e.clientY, { s: 1, x: 0, y: 0 });
    return;
  }
  lastTap = now;
  if (zs === 1) tapTimer = setTimeout(() => { if (lastTap === now) closeView(); }, 300);   // a single tap closes (at normal size)
}
let tapTimer = 0;
view.addEventListener('pointerup', up);
view.addEventListener('pointercancel', e => { pts.delete(e.pointerId); if (zs === 1) pullBack(); });
function pullBack() {
  vimg.animate([{ transform: vimg.style.transform }, { transform: 'none' }], { duration: 180, easing: 'ease-out' });
  vimg.style.transform = ''; view.style.background = '';
}
function shut() { view.hidden = true; vimg.removeAttribute('src'); view.style.background = ''; document.body.style.overflow = ''; zoomReset(); }
function closeView() { if (view.hidden) return; if (history.state && history.state.view) history.back(); else shut(); }
addEventListener('popstate', () => { if (!view.hidden) shut(); });
document.getElementById('view-x').addEventListener('click', e => { e.stopPropagation(); closeView(); });
addEventListener('keydown', e => {
  if (e.key === 'Escape') closeView();
  else if (!view.hidden && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); step(e.key === 'ArrowRight' ? 1 : -1); }
});
$('shoot').addEventListener('click', () => scanFrom($('video'), boxInVideo()));
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
  scanFrom(img, [0, 0, img.naturalWidth, img.naturalHeight]);
  e.target.value = '';
});
(async () => {
  let cam = null;
  try {
    cam = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    $('video').srcObject = cam;
  } catch (e) { status('No camera here (or not allowed): use Choose a photo.'); }
  try {
    await ready();
    $('shoot').disabled = !cam;
    status(cam ? `Ready · ${DATA.issues.length.toLocaleString()} issues` : 'Ready: use Choose a photo.');
  } catch (e) { status('Could not get ready: ' + e.message); }
})();
</script>
